7b5f70672?q=80&w=800",views:4310,createdAt:Date.now()-40000000,updatedAt:Date.now()-40000000,published:!0},{id:"5",docId:"post_5",title:"Why Your Money Plant Leaves Are Turning Yellow",slug:"money-plant-yellow-leaves",excerpt:"Overwatering? Low light? We diagnose with photos and quick fixes.",content:"Yellow leaves = usually overwatering or lack of nitrogen. Check roots, cut mushy parts, shift to bright indirect light. Feed diluted seaweed.",author:"Anjali Rao",date:"2024-06-02",category:"Plant Care",image:"https://images.unsplash.com/photo-1614594975525-e45190c55d0b?q=80&w=800",views:2980,createdAt:Date.now()-50000000,updatedAt:Date.now()-50000000,published:!0},{id:"6",docId:"post_6",title:"Rooftop Farming in Delhi: Growing 20kg Vegetables Monthly",slug:"rooftop-farming-delhi",excerpt:"Meet Priya who turned 600 sq ft terrace into a food forest feeding her family.",content:"Using grow bags, compost from kitchen waste, and drip irrigation, Priya harvests tomatoes, spinach, brinjals year-round despite 45°C summers.",author:"Amit Kumar",date:"2024-05-30",category:"Farming",image:"https://images.unsplash.com/photo-1471193945509-9ad0617afabf?q=80&w=800",views:3890,createdAt:Date.now()-60000000,updatedAt:Date.now()-60000000,published:!0},{id:"7",docId:"post_7",title:"Snake Plant Myths: Does It Really Give Oxygen at Night?",slug:"snake-plant-myths-oxygen",excerpt:"We tested with a CO2 meter for 7 nights. Here's the truth.",content:"Yes, CAM plants like Snake Plant convert CO2 at night, but amount is modest. One plant per 10 sq ft slightly improves air. Best benefit is low maintenance.",author:"Dr. Kavita Menon",date:"2024-05-28",category:"Plant Facts",image:"https://images.unsplash.com/photo-1599598177994-86a1a6b2c94d?q=80&w=800",views:6100,createdAt:Date.now()-70000000,updatedAt:Date.now()-70000000,published:!0},{id:"8",docId:"post_8",title:"How to Propagate Rose from Cuttings in 4 Steps",slug:"propagate-rose-cuttings",excerpt:"Don't buy new roses. Multiply your favorite     // POSTS - Public read only if published

      allow write: if request.auth != null

      allow read: if true;
      allow write: if request.auth != null

    }
  }
}
