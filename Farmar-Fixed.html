root rot. Learn 5 drainage hacks every Indian balcony gardener must know.",content:"Monsoon is beautiful but tricky for indoor plants. Excess humidity reduces transpiration, so soil stays wet longer. Always check moisture with finger test up to 2 inches deep. Add perlite to your mix for aeration. Elevate pots on pebble trays. Reduce watering frequency by 50% and skip fertilizing until September. If leaves yellow, move to brighter spot and trim affected roots.",author:"Anjali Rao",date:"2024-06-12",category:"Plant Care",image:"https://images.unsplash.com/photo-1416879595882-3373a0480b5b?q=80&w=800",views:3420,tip:"Tip: Use terracotta pots in monsoon – they breathe better than plastic and prevent waterlogging."},{id:2,title:"Tulsi in Every Home: Scientific Benefits Beyond Tradition",slug:"tulsi-scientific-benefits",excerpt:"From adaptogen to air purifier, why ISRO recommends Tulsi for closed environments.",content:"Tulsi emits oxygen 20 hours a day and absorbs CO2, SO2. Its eugenol compound is anti-inflammatory. Grow in east-facing window, pinch flower buds to encourage leaves. Harvest top leaves regularly.",author:"Dr. Kavita Menon",date:"2024-06-10",category:"Herb",image:"https://images.unsplash.com/photo-1518531938570-fa2d80e05d2e?q=80&w=800",views:5120},{id:3,title:"5 Plants That Thrive in Mumbai's Humid Apartments",slug:"plants-mumbai-humid-apartments",excerpt:"Small space, low light, high humidity? These forgiving greens will still flourish.",content:"Money Plant, Snake Plant, Spider Plant, Peace Lily, and Ferns love Mumbai conditions. They tolerate sea breeze and infrequent care.",author:"Rohan Shetty",date:"2024-06-08",category:"Gardening",image:"https://images.unsplash.com/photo-1614594975525-e45190c55d0b?q=80&w=800",views:2780},{id:4,title:"Organic Pest Control: Neem Spray Recipe That Actually Works",slug:"neem-spray-recipe",excerpt:"Ditch chemicals. Make this 3-ingredient neem oil spray for mealybugs, aphids and fungus.",content:"Mix 1 tsp cold-pressed neem oil + 1/2 tsp liquid soap + 1 liter warm water. Spray in evening, repeat every 7 days. Works on roses, tulsi, vegetables.",author:"Farmar Team",date:"2024-06-05",category:"Farming",image:"https://images.unsplash.com/photo-1446071103084-c257b5f70672?q=80&w=800",views:4310},{id:5,title:"Why Your Money Plant Leaves Are Turning Yellow",slug:"money-plant-yellow-leaves",excerpt:"Overwatering? Low light? We diagnose with photos and quick fixes.",content:"Yellow leaves = usually overwatering or lack of nitrogen. Check roots, cut mushy parts, shift to bright indirect light. Feed diluted seaweed.",author:"Anjali Rao",date:"2024-06-02",category:"Plant Care",image:"https://images.unsplash.com/photo-1614594975525-e45190c55d0b?q=80&w=800",views:2980},{id:6,title:"Rooftop Farming in Delhi: Growing 20kg Vegetables Monthly",slug:"rooftop-farming-delhi",excerpt:"Meet Priya who turned 600 sq ft terrace into a food forest feeding her family.",content:"Using grow bags, compost from kitchen waste, and drip irrigation, Priya harvests tomatoes, spinach, brinjals year-round despite 45°C summers.",author:"Amit Kumar",date:"2024-05-30",category:"Farming",image:"https://images.unsplash.com/photo-1471193945509-9ad0617afabf?q=80&w=800",views:3890},{id:7,title:"Snake Plant Myths: Does It Really Give Oxygen at Night?",slug:"snake-plant-myths-oxygen",excerpt:"We tested with a CO2 meter for 7 nights. Here's the truth.",content:"Yes, CAM plants like Snake Plant convert CO2 at night, but amount is modest. One plant per 10 sq ft slightly improves air. Best benefit is low maintenance.",author:"Dr. Kavita Menon",date:"2024-05-28",category:"Plant Facts",image:"https://images.unsplash.com/photo-1599598177994-86a1a6b2c94d?q=80&w=800",views:6100},{id:8,title:"How to Propagate Rose from Cuttings in 4 Steps",slug:"propagate-rose-cuttings",excerpt:"Don't buy new roses. Multiply your favorite Desi Gulab with this foolproof method.",content:"Take 6-inch semi-hardwood cutting, remove lower leaves, dip in honey +
